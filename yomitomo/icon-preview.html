<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコン案</title>
<style>
  body{font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;background:#fff7fb;color:#5b4a52;text-align:center;margin:0;padding:30px 16px 60px;}
  h1{color:#ff8fbf;font-size:24px;}
  .row{display:flex;flex-direction:column;gap:28px;align-items:center;margin-top:24px;}
  .card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 0 #f2d8e6;width:280px;}
  .ic{width:150px;height:150px;border-radius:34px;overflow:hidden;margin:0 auto;box-shadow:0 8px 20px #0002;}
  .ic img{width:100%;height:100%;display:block;}
  .lab{font-weight:bold;font-size:20px;margin-top:14px;}
  .desc{font-size:13px;color:#a98;margin-top:6px;line-height:1.6;}
  .small{display:flex;gap:10px;justify-content:center;margin-top:12px;}
  .small .ic{width:56px;height:56px;border-radius:14px;box-shadow:0 3px 8px #0002;}
</style>
</head>
<body>
  <h1>よみとも アイコン案</h1>
  <div style="color:#a98;font-size:14px">気に入った案（A／B／C）を教えてください</div>
  <div class="row">
    <div class="card"><div class="ic"><img src="icon-a.svg"></div>
      <div class="lab">A：よぞらと本</div>
      <div class="desc">紫〜ピンクの夜空に、白い本ときらめき。落ち着いた大人っぽい雰囲気。</div>
      <div class="small"><div class="ic"><img src="icon-a.svg"></div></div>
    </div>
    <div class="card"><div class="ic"><img src="icon-b.svg"></div>
      <div class="lab">B：あさひと本</div>
      <div class="desc">あたたかいオレンジ〜紫に、太陽（朝日）と本。前向きで明るい印象。</div>
      <div class="small"><div class="ic"><img src="icon-b.svg"></div></div>
    </div>
    <div class="card"><div class="ic"><img src="icon-c.svg"></div>
      <div class="lab">C：ミニマルな本</div>
      <div class="desc">白地にグラデーションの本としおり。シンプルで洗練された今っぽさ。</div>
      <div class="small"><div class="ic"><img src="icon-c.svg"></div></div>
    </div>
  </div>
</body>
</html>
