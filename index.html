<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET BOTTLE SHOOTER</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ddff">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; image-rendering: pixelated; }
  #ui { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 480px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =============================================
// SECTION 1: CONSTANTS & CONFIG
// =============================================
const W = 480, H = 720;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// Scale canvas to fit screen
(function scaleCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
})();
window.addEventListener('resize', () => {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
});

const STATES = { TITLE: 0, PLAYING: 1, GAME_OVER: 2 };
const CONFIG = {
  playerSpeed: 4,
  dashSpeed: 12,
  dashDuration: 12,
  dashCooldown: 60,
  waterMax: 100,
  bulletSpeed: 10,
  bulletCooldown: 12,
  carbonMax: 100,
  carbonFill: 1.5,
  carbonOverfill: 120,
  carbonPenaltyDuration: 180,
};

// =============================================
// SECTION 2: MATH & UTILS
// =============================================
const rnd = (a, b) => Math.random() * (b - a) + a;
const rndInt = (a, b) => Math.floor(rnd(a, b));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

function collides(a, b) {
  return Math.abs(a.x - b.x) < (a.r + b.r) && Math.abs(a.y - b.y) < (a.r + b.r);
}

// =============================================
// SECTION 3: INPUT MANAGER
// =============================================
const keys = {};
const justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch support
let touchLeft = false, touchRight = false, touchFire = false, touchDash = false;
function addTouchControls() {
  // Canvas tap → start game on title/gameover screens
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (gameState !== STATES.PLAYING) justPressed['Space'] = true;
  }, {passive: false});

  const pad = document.createElement('div');
  pad.style.cssText = `position:fixed;bottom:0;left:0;width:100%;height:110px;display:flex;pointer-events:auto;z-index:10;`;
  pad.innerHTML = `
    <button id="tl" style="flex:1;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;touch-action:none;-webkit-tap-highlight-color:transparent;">◀</button>
    <button id="td" style="flex:1;background:rgba(0,200,255,.2);border:none;color:#fff;font-size:12px;touch-action:none;-webkit-tap-highlight-color:transparent;">DASH</button>
    <button id="tz" style="flex:1;background:rgba(0,255,150,.2);border:none;color:#fff;font-size:11px;touch-action:none;-webkit-tap-highlight-color:transparent;">CARBO</button>
    <button id="tf" style="flex:2;background:rgba(255,100,0,.25);border:none;color:#fff;font-size:13px;touch-action:none;-webkit-tap-highlight-color:transparent;">FIRE</button>
    <button id="tr" style="flex:1;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;touch-action:none;-webkit-tap-highlight-color:transparent;">▶</button>
  `;
  document.body.appendChild(pad);

  const btn = (id, onDown, onUp) => {
    const el = document.getElementById(id);
    const up = onUp || (() => {});
    el.addEventListener('touchstart',  e => { e.preventDefault(); onDown(); }, {passive:false});
    el.addEventListener('touchend',    e => { e.preventDefault(); up(); },    {passive:false});
    el.addEventListener('touchcancel', e => { e.preventDefault(); up(); },    {passive:false});
  };

  btn('tl', () => touchLeft = true,  () => touchLeft = false);
  btn('tr', () => touchRight = true, () => touchRight = false);
  btn('tf', () => { touchFire = true;  if (gameState !== STATES.PLAYING) justPressed['Space'] = true; },
            () => { touchFire = false; });
  btn('td', () => { justPressed['ShiftLeft'] = true; }, () => {});
  btn('tz', () => { justPressed['KeyZ'] = true; }, () => {});
}
if ('ontouchstart' in window) addTouchControls();

const input = {
  left: () => keys['ArrowLeft'] || keys['KeyA'] || touchLeft,
  right: () => keys['ArrowRight'] || keys['KeyD'] || touchRight,
  fire: () => keys['Space'] || touchFire,
  dash: () => keys['ShiftLeft'] || keys['ShiftRight'] || touchDash,
};

// =============================================
// SECTION 4: DRAWING LIBRARY
// =============================================

function drawStars(stars, t) {
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(t * 0.05 + s.phase);
    ctx.globalAlpha = s.brightness * twinkle;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(x, y, flamePhase, dashCooldownRatio, penalized) {
  ctx.save();
  ctx.translate(x, y);

  // Engine flame (behind ship)
  if (!penalized) {
    const flameH = 18 + 8 * Math.sin(flamePhase);
    const grad = ctx.createLinearGradient(0, 12, 0, 12 + flameH);
    grad.addColorStop(0, 'rgba(255,220,50,0.9)');
    grad.addColorStop(0.5, 'rgba(255,80,0,0.7)');
    grad.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-8, 12);
    ctx.quadraticCurveTo(-4 + 3*Math.sin(flamePhase), 12 + flameH * 0.6, 0, 12 + flameH);
    ctx.quadraticCurveTo(4 + 3*Math.sin(flamePhase+1), 12 + flameH * 0.6, 8, 12);
    ctx.closePath();
    ctx.fill();
  } else {
    // penalty: smoke
    ctx.fillStyle = 'rgba(150,150,150,0.5)';
    ctx.beginPath();
    ctx.arc(0, 20, 8 + 4*Math.sin(flamePhase), 0, Math.PI*2);
    ctx.fill();
  }

  // Body (PET bottle shape)
  const bodyGrad = ctx.createLinearGradient(-14, -10, 14, 10);
  bodyGrad.addColorStop(0, 'rgba(160,220,255,0.9)');
  bodyGrad.addColorStop(0.5, 'rgba(200,240,255,0.7)');
  bodyGrad.addColorStop(1, 'rgba(100,180,230,0.85)');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-14, 12);
  ctx.bezierCurveTo(-16, 4, -16, -4, -10, -10);
  ctx.lineTo(10, -10);
  ctx.bezierCurveTo(16, -4, 16, 4, 14, 12);
  ctx.closePath();
  ctx.fill();

  // Label band
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(-13, -2, 26, 10);
  ctx.fillStyle = 'rgba(50,150,255,0.6)';
  ctx.font = 'bold 6px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('PET', 0, 6);

  // Neck
  ctx.fillStyle = 'rgba(180,230,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(-10, -10);
  ctx.lineTo(-6, -22);
  ctx.lineTo(6, -22);
  ctx.lineTo(10, -10);
  ctx.closePath();
  ctx.fill();

  // Cap (red)
  ctx.fillStyle = penalized ? '#888' : '#e53935';
  ctx.beginPath();
  ctx.arc(0, -25, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = penalized ? '#aaa' : '#ff5252';
  ctx.beginPath();
  ctx.arc(-2, -27, 3, 0, Math.PI * 2);
  ctx.fill();

  // Outline
  ctx.strokeStyle = 'rgba(100,200,255,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-14, 12);
  ctx.bezierCurveTo(-16, 4, -16, -4, -10, -10);
  ctx.lineTo(10, -10);
  ctx.bezierCurveTo(16, -4, 16, 4, 14, 12);
  ctx.closePath();
  ctx.stroke();

  // Dash cooldown indicator (ring)
  if (dashCooldownRatio < 1) {
    ctx.strokeStyle = `rgba(0,200,255,${0.8 - dashCooldownRatio * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 20, -Math.PI/2, -Math.PI/2 + Math.PI*2*dashCooldownRatio);
    ctx.stroke();
  }

  ctx.restore();
}

function drawBullet(x, y, isCarbonation) {
  ctx.save();
  ctx.translate(x, y);
  if (isCarbonation) {
    // Carbonation explosion bullet — fizzy bubble cluster
    const r = 10;
    const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, r);
    grad.addColorStop(0, 'rgba(200,255,255,1)');
    grad.addColorStop(0.4, 'rgba(100,200,255,0.8)');
    grad.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    // bubbles
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const bx = Math.cos(angle) * 7, by = Math.sin(angle) * 7;
      ctx.fillStyle = 'rgba(180,240,255,0.7)';
      ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();
    }
  } else {
    // Normal bullet — water droplet
    ctx.fillStyle = 'rgba(100,220,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 3, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(200,240,255,0.7)';
    ctx.beginPath();
    ctx.ellipse(-1, -2, 1.5, 3, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEnemyDrone(x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#7fff00';
  ctx.strokeStyle = '#00ff44';
  ctx.lineWidth = 1.5;
  // body
  ctx.beginPath();
  ctx.moveTo(0, -12); ctx.lineTo(10, 8); ctx.lineTo(-10, 8); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // eye
  ctx.fillStyle = '#ff0';
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(1, 0, 2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEnemyJellyfish(x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  // body dome
  const g = ctx.createRadialGradient(0, -6, 2, 0, 0, 18);
  g.addColorStop(0, 'rgba(220,100,255,0.9)');
  g.addColorStop(1, 'rgba(120,0,200,0.4)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 18, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  // tentacles
  ctx.strokeStyle = 'rgba(200,100,255,0.7)';
  ctx.lineWidth = 1.5;
  for (let i = -3; i <= 3; i++) {
    const ox = i * 4;
    ctx.beginPath();
    ctx.moveTo(ox, 5);
    for (let j = 0; j < 10; j++) {
      const ty = 5 + j * 2.5;
      const tx = ox + Math.sin(t * 0.08 + i * 0.8 + j * 0.5) * 4;
      ctx.lineTo(tx, ty);
    }
    ctx.stroke();
  }
  // eye
  ctx.fillStyle = '#ff88ff';
  ctx.beginPath(); ctx.arc(0, -8, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#600';
  ctx.beginPath(); ctx.arc(1, -8, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEnemySquid(x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  // body
  ctx.fillStyle = '#ff6600';
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.bezierCurveTo(16, -18, 20, 0, 16, 14);
  ctx.bezierCurveTo(8, 20, -8, 20, -16, 14);
  ctx.bezierCurveTo(-20, 0, -16, -18, 0, -18);
  ctx.fill();
  // arms
  ctx.strokeStyle = '#ff9933';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI + Math.PI/12;
    const len = 14 + 4 * Math.sin(t * 0.1 + i);
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(Math.cos(angle) * len + (i < 3 ? -8 : 8), Math.sin(angle) * len + 16);
    ctx.stroke();
  }
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-7, -4, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -4, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-6, -4, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -4, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEnemyMothership(x, y, t, hp, hpMax) {
  ctx.save();
  ctx.translate(x, y);
  // Shield glow
  ctx.strokeStyle = `rgba(255,50,50,${0.3 + 0.2*Math.sin(t*0.05)})`;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI*2); ctx.stroke();
  // Body
  const g = ctx.createRadialGradient(0, -10, 5, 0, 0, 50);
  g.addColorStop(0, '#cc0000');
  g.addColorStop(0.6, '#880000');
  g.addColorStop(1, '#330000');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, 50, 25, 0, 0, Math.PI*2);
  ctx.fill();
  // Dome
  const dg = ctx.createRadialGradient(-5, -20, 2, 0, -15, 20);
  dg.addColorStop(0, 'rgba(255,150,150,0.9)');
  dg.addColorStop(1, 'rgba(180,0,0,0.6)');
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.ellipse(0, -15, 20, 18, 0, 0, Math.PI*2);
  ctx.fill();
  // Bottom guns
  ctx.fillStyle = '#ff3333';
  for (let i = -2; i <= 2; i++) {
    ctx.fillRect(i * 18 - 3, 18, 6, 10 + 2*Math.sin(t*0.07 + i));
  }
  // HP bar
  const bw = 80;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(-bw/2, 30, bw, 8);
  ctx.fillStyle = hp/hpMax > 0.5 ? '#0f0' : hp/hpMax > 0.25 ? '#ff0' : '#f00';
  ctx.fillRect(-bw/2, 30, bw * (hp/hpMax), 8);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(-bw/2, 30, bw, 8);
  ctx.restore();
}

function drawEnemyBullet(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ff4444';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.life / p.maxLife;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawHUD(score, hiScore, carbonRatio, waterRatio, wave, penaltyTimer, lives) {
  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, 44);

  // Score
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, 8, 18);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px Courier New';
  ctx.fillText(`HI: ${hiScore}`, 8, 34);

  // Lives (draw mini bottle icons)
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#00ccff' : 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(W/2 - 28 + i * 28, 32, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = i < lives ? '#ff3333' : 'rgba(255,0,0,0.2)';
    ctx.beginPath();
    ctx.arc(W/2 - 28 + i * 28, 24, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Wave
  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${wave}`, W/2, 20);

  // Carbonation gauge
  ctx.textAlign = 'right';
  ctx.fillStyle = '#aaa';
  ctx.font = '10px Courier New';
  ctx.fillText('CARBO', W - 8, 12);
  const cBarW = 80, cBarH = 10;
  const cBarX = W - 8 - cBarW, cBarY = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(cBarX, cBarY, cBarW, cBarH);
  const cColor = carbonRatio > 0.85 ? '#ff4400' : carbonRatio > 0.6 ? '#ffaa00' : '#00ddff';
  ctx.fillStyle = cColor;
  ctx.fillRect(cBarX, cBarY, cBarW * carbonRatio, cBarH);
  if (penaltyTimer > 0) {
    ctx.fillStyle = 'rgba(255,100,0,0.7)';
    ctx.fillRect(cBarX, cBarY, cBarW, cBarH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('OVERFILL!', cBarX + cBarW/2, cBarY + 8);
  }
  ctx.strokeStyle = 'rgba(0,200,255,0.8)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cBarX, cBarY, cBarW, cBarH);

  // Water gauge (for dash)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#aaa';
  ctx.font = '10px Courier New';
  ctx.fillText('WATER', W - 8, 34);
  const wBarY = 36;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(cBarX, wBarY, cBarW, 6);
  ctx.fillStyle = '#00aaff';
  ctx.fillRect(cBarX, wBarY, cBarW * waterRatio, 6);
  ctx.strokeStyle = 'rgba(0,150,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cBarX, wBarY, cBarW, 6);
}

// =============================================
// SECTION 5: GAME OBJECTS
// =============================================
class Player {
  constructor() { this.reset(); }
  reset() {
    this.x = W / 2;
    this.y = H - 80;
    this.r = 18;
    this.flamePhase = 0;
    this.dashTimer = 0;
    this.dashCooldown = 0;
    this.dashDir = 0;
    this.water = CONFIG.waterMax;
    this.bulletCooldown = 0;
    this.carbonation = 0;
    this.penaltyTimer = 0;
    this.spaceHeld = 0;
    this.invincible = 0;
  }
  update() {
    this.flamePhase += 0.2;

    // Penalty (overfill)
    if (this.penaltyTimer > 0) {
      this.penaltyTimer--;
      return; // no movement during penalty
    }

    // Dash
    if (this.dashCooldown > 0) this.dashCooldown--;
    if (this.dashTimer > 0) {
      this.x += this.dashDir * CONFIG.dashSpeed;
      this.dashTimer--;
    } else {
      // Normal movement
      if (input.left()) this.x -= CONFIG.playerSpeed;
      if (input.right()) this.x += CONFIG.playerSpeed;
    }

    // Trigger dash
    if (justPressed['ShiftLeft'] || justPressed['ShiftRight']) {
      if (this.dashCooldown === 0 && this.water >= 20) {
        this.dashDir = input.left() ? -1 : 1;
        this.dashTimer = CONFIG.dashDuration;
        this.dashCooldown = CONFIG.dashCooldown;
        this.water -= 20;
        spawnDashTrail(this.x, this.y, this.dashDir);
      }
    }

    this.x = clamp(this.x, 20, W - 20);

    // Carbonation fill (hold space)
    if (input.fire() && this.bulletCooldown === 0) {
      this.spaceHeld++;
      if (this.spaceHeld > 8) {
        // Rapid press detected as carbonation fill
        this.carbonation = clamp(this.carbonation + CONFIG.carbonFill, 0, CONFIG.carbonMax + 30);
        if (this.carbonation >= CONFIG.carbonMax + 30) {
          this.penaltyTimer = CONFIG.carbonPenaltyDuration;
          this.carbonation = 0;
          spawnExplosion(this.x, this.y, '#ff8800', 12);
        }
      } else {
        // Normal shot
        fireBullet(this);
        this.bulletCooldown = CONFIG.bulletCooldown;
        this.carbonation = clamp(this.carbonation + CONFIG.carbonFill * 0.5, 0, CONFIG.carbonMax + 30);
      }
    } else {
      this.spaceHeld = 0;
    }

    if (this.bulletCooldown > 0) this.bulletCooldown--;

    // Manual carbonation release: press Z
    if (justPressed['KeyZ'] && this.carbonation >= 30) {
      fireCarbonationBlast(this);
      this.carbonation = 0;
    }

    if (this.invincible > 0) this.invincible--;
    this.water = Math.min(this.water + 0.05, CONFIG.waterMax);
  }
  draw() {
    const dashRatio = 1 - (this.dashCooldown / CONFIG.dashCooldown);
    drawPlayer(this.x, this.y, this.flamePhase, dashRatio, this.penaltyTimer > 0);
  }
}

class Bullet {
  constructor(x, y, vy, isCarbonation, isEnemy) {
    this.x = x; this.y = y;
    this.vy = vy;
    this.isCarbonation = isCarbonation;
    this.isEnemy = isEnemy;
    this.r = isCarbonation ? 10 : 4;
    this.alive = true;
  }
  update() {
    this.y += this.vy;
    if (this.y < -20 || this.y > H + 20) this.alive = false;
  }
  draw() {
    if (this.isEnemy) drawEnemyBullet(this.x, this.y);
    else drawBullet(this.x, this.y, this.isCarbonation);
  }
}

class Enemy {
  constructor(type, x, y) {
    this.type = type;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.t = 0;
    this.alive = true;
    this.shootCooldown = rndInt(60, 180);
    switch(type) {
      case 'drone':     this.r = 12; this.hp = 1;  this.maxHp = 1;  this.score = 10;  this.vx = rnd(-1.5,1.5); this.vy = rnd(1,2.5); break;
      case 'jellyfish': this.r = 18; this.hp = 3;  this.maxHp = 3;  this.score = 30;  this.vy = rnd(0.5,1.2);  break;
      case 'squid':     this.r = 20; this.hp = 5;  this.maxHp = 5;  this.score = 50;  this.vy = rnd(1.5,2.5);  break;
      case 'mothership':this.r = 50; this.hp = 40; this.maxHp = 40; this.score = 300; this.vy = 0.3; break;
    }
  }
  update(t) {
    this.t++;
    switch(this.type) {
      case 'drone':
        this.x += this.vx + 1.2 * Math.sin(this.t * 0.12 + this.phase);
        this.y += this.vy;
        if (this.x < 15 || this.x > W-15) this.vx *= -1;
        break;
      case 'jellyfish':
        this.x += 2.5 * Math.sin(this.t * 0.04 + this.phase);
        this.y += this.vy;
        break;
      case 'squid':
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 25 || this.x > W-25) this.vx *= -1;
        this.shootCooldown--;
        if (this.shootCooldown <= 0) {
          shootAtPlayer(this);
          this.shootCooldown = rndInt(60, 120);
        }
        break;
      case 'mothership':
        this.x += 1.5 * Math.sin(this.t * 0.015);
        this.y = Math.min(this.y + this.vy, 130);
        this.shootCooldown--;
        if (this.shootCooldown <= 0) {
          shootSpread(this);
          this.shootCooldown = 60;
        }
        break;
    }
    if (this.y > H + 60) this.alive = false;
  }
  draw(t) {
    switch(this.type) {
      case 'drone':     drawEnemyDrone(this.x, this.y, t); break;
      case 'jellyfish': drawEnemyJellyfish(this.x, this.y, t); break;
      case 'squid':     drawEnemySquid(this.x, this.y, t); break;
      case 'mothership': drawEnemyMothership(this.x, this.y, t, this.hp, this.maxHp); break;
    }
  }
}

class Particle {
  constructor(x, y, vx, vy, color, r, life) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.r = r;
    this.life = life; this.maxLife = life;
    this.alive = true;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08;
    this.vx *= 0.97;
    this.life--;
    if (this.life <= 0) this.alive = false;
  }
}

// =============================================
// SECTION 6: SYSTEMS
// =============================================
let player, bullets, enemies, particles, stars;
let score, wave, waveTimer, t, lives;
let bossActive;

function initStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({ x: rnd(0,W), y: rnd(0,H), size: rnd(0.5,2.5), brightness: rnd(0.3,1), phase: rnd(0,Math.PI*2) });
  }
}

function resetGame() {
  player = new Player();
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  wave = 1;
  waveTimer = 180;
  t = 0;
  bossActive = false;
  spawnWave(wave);
}

function fireBullet(p) {
  bullets.push(new Bullet(p.x, p.y - 30, -CONFIG.bulletSpeed, false, false));
}

function fireCarbonationBlast(p) {
  // Wide spread + penetrating
  for (let i = -2; i <= 2; i++) {
    const vx = i * 2;
    const b = new Bullet(p.x + i * 8, p.y - 28, -CONFIG.bulletSpeed * 0.9, true, false);
    b.vx = vx;
    b.penetrating = true;
    bullets.push(b);
  }
  spawnExplosion(p.x, p.y - 30, '#00ccff', 10);
}

function shootAtPlayer(enemy) {
  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const speed = 3.5;
  bullets.push(new Bullet(enemy.x, enemy.y + enemy.r, dy/dist*speed, false, true));
  bullets.push(new Bullet(enemy.x, enemy.y + enemy.r, (dy/dist*speed) * 0.8, false, true));
  const nb = bullets[bullets.length-1];
  nb.vx = dx/dist * speed * 0.2;
}

function shootSpread(enemy) {
  for (let i = -2; i <= 2; i++) {
    const b = new Bullet(enemy.x + i * 15, enemy.y + 30, 3, false, true);
    b.vx = i * 1.2;
    bullets.push(b);
  }
}

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = rnd(0, Math.PI * 2);
    const speed = rnd(1, 5);
    particles.push(new Particle(x, y, Math.cos(angle)*speed, Math.sin(angle)*speed - 1, color, rnd(2,6), rndInt(20,45)));
  }
}

function spawnDashTrail(x, y, dir) {
  for (let i = 0; i < 8; i++) {
    particles.push(new Particle(x, y + rnd(-10, 20), dir * rnd(-2, -0.5), rnd(-1, 1), 'rgba(0,180,255,0.8)', rnd(2,5), rndInt(10,25)));
  }
}

function spawnWave(w) {
  waveTimer = 0;
  if (w % 5 === 0) {
    // Boss wave
    enemies.push(new Enemy('mothership', W/2, -60));
    bossActive = true;
    return;
  }
  const count = 4 + w * 2;
  const types = ['drone'];
  if (w >= 2) types.push('jellyfish');
  if (w >= 3) types.push('squid');
  for (let i = 0; i < count; i++) {
    const type = types[rndInt(0, types.length)];
    enemies.push(new Enemy(type, rnd(30, W-30), rnd(-120, -20) - i * 15));
  }
}

function updateCollisions() {
  for (const b of bullets) {
    if (!b.alive || b.isEnemy) continue;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (collides(b, e)) {
        e.hp--;
        if (!b.penetrating) b.alive = false;
        if (e.hp <= 0) {
          e.alive = false;
          score += e.score;
          hiScore = Math.max(hiScore, score);
          const colors = { drone:'#7fff00', jellyfish:'#dd00ff', squid:'#ff6600', mothership:'#ff0000' };
          spawnExplosion(e.x, e.y, colors[e.type], e.type === 'mothership' ? 30 : 8);
          if (e.type === 'mothership') {
            bossActive = false;
            // Spawn minions on death
            for (let i = 0; i < 4; i++) {
              enemies.push(new Enemy('drone', e.x + rnd(-80,80), e.y + rnd(-20,20)));
            }
          }
          // Water refill on kill (Jet Dash mechanic)
          player.water = Math.min(player.water + 15, CONFIG.waterMax);
        }
        break;
      }
    }
  }

  // Enemy bullets vs player
  if (player.invincible === 0) {
    for (const b of bullets) {
      if (!b.alive || !b.isEnemy) continue;
      if (collides(b, player)) {
        b.alive = false;
        lives--;
        player.invincible = 120;
        spawnExplosion(player.x, player.y, '#ff4444', 10);
        break;
      }
    }
  }
}

// =============================================
// SECTION 7: WAVE MANAGEMENT
// =============================================
function updateWave() {
  if (bossActive) return;
  const aliveEnemies = enemies.filter(e => e.alive).length;
  if (aliveEnemies === 0) {
    waveTimer++;
    if (waveTimer > 120) {
      wave++;
      spawnWave(wave);
    }
  }
}

// =============================================
// SECTION 8: TITLE & GAME OVER SCREENS
// =============================================
function drawTitle(t) {
  // Starfield
  drawStars(stars, t);

  // Title
  ctx.save();
  const pulse = 1 + 0.03 * Math.sin(t * 0.05);
  ctx.translate(W/2, H/2 - 60);
  ctx.scale(pulse, pulse);
  ctx.textAlign = 'center';
  ctx.font = 'bold 36px Courier New';
  ctx.fillStyle = '#00ddff';
  ctx.shadowColor = '#00aaff';
  ctx.shadowBlur = 20;
  ctx.fillText('PET BOTTLE', 0, -20);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#ffffff';
  ctx.fillText('SHOOTER', 0, 20);
  ctx.restore();

  // Demo player ship
  drawPlayer(W/2, H/2 + 30, t * 0.3, 1, false);

  ctx.fillStyle = '#aaa';
  ctx.font = '13px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('← → : MOVE    SPACE : FIRE', W/2, H/2 + 120);
  ctx.fillText('SHIFT : JET DASH    Z : CARBONATION BLAST', W/2, H/2 + 140);

  ctx.fillStyle = `rgba(255,255,100,${0.5 + 0.5*Math.sin(t*0.06)})`;
  ctx.font = 'bold 16px Courier New';
  ctx.fillText('PRESS SPACE TO START', W/2, H/2 + 175);

  // HiScore
  if (hiScore > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '14px Courier New';
    ctx.fillText(`HI-SCORE: ${hiScore}`, W/2, H/2 + 200);
  }
}

function drawGameOver(finalScore, t) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  ctx.font = 'bold 40px Courier New';
  ctx.fillStyle = '#ff3333';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W/2, H/2 - 60);
  ctx.shadowBlur = 0;

  ctx.font = '20px Courier New';
  ctx.fillStyle = '#fff';
  ctx.fillText(`SCORE: ${finalScore}`, W/2, H/2 - 10);

  if (finalScore >= hiScore && finalScore > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px Courier New';
    ctx.fillText('NEW HI-SCORE!', W/2, H/2 + 25);
  }

  ctx.fillStyle = `rgba(255,255,100,${0.5 + 0.5*Math.sin(t*0.06)})`;
  ctx.font = '16px Courier New';
  ctx.fillText('PRESS SPACE TO RETRY', W/2, H/2 + 70);
}

// =============================================
// SECTION 9: GAME LOOP
// =============================================
let gameState = STATES.TITLE;
let hiScore = parseInt(localStorage.getItem('petbottle_hi') || '0');
let finalScore = 0;

initStars();
resetGame();

function gameLoop() {
  t++;
  // Clear each frame
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#000010');
  bg.addColorStop(1, '#000820');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (gameState === STATES.TITLE) {
    drawTitle(t);
    if (justPressed['Space'] || justPressed['Enter']) {
      gameState = STATES.PLAYING;
      resetGame();
    }

  } else if (gameState === STATES.PLAYING) {
    // Update stars (slow scroll)
    for (const s of stars) { s.y += s.size * 0.3; if (s.y > H) s.y = -2; }
    drawStars(stars, t);

    // Update
    player.update();
    for (const b of bullets) { b.update(); if (b.vx) b.x += b.vx; }
    for (const e of enemies) e.update(t);
    for (const p of particles) p.update();

    // Remove dead objects
    bullets = bullets.filter(b => b.alive);
    enemies = enemies.filter(e => e.alive);
    particles = particles.filter(p => p.alive);

    updateCollisions();
    updateWave();

    // Draw particles (behind everything)
    for (const p of particles) drawParticle(p);

    // Draw game objects
    for (const b of bullets) b.draw();
    for (const e of enemies) e.draw(t);

    // Player blink when invincible
    if (player.invincible === 0 || Math.floor(t / 5) % 2 === 0) {
      player.draw();
    }

    drawHUD(score, hiScore, player.carbonation / CONFIG.carbonMax, player.water / CONFIG.waterMax, wave, player.penaltyTimer, lives);

    // Wave clear banner
    if (enemies.filter(e=>e.alive).length === 0 && waveTimer > 0 && waveTimer < 120) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 24px Courier New';
      ctx.fillStyle = `rgba(255,255,0,${1 - waveTimer/120})`;
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 10;
      ctx.fillText(`WAVE ${wave} CLEAR!`, W/2, H/2);
      ctx.shadowBlur = 0;
    }

    // Game over when all lives lost
    if (lives <= 0) {
      gameState = STATES.GAME_OVER;
      finalScore = score;
      hiScore = Math.max(hiScore, score);
      localStorage.setItem('petbottle_hi', hiScore);
    }

  } else if (gameState === STATES.GAME_OVER) {
    // Keep drawing background
    drawStars(stars, t);
    drawGameOver(finalScore, t);
    if (justPressed['Space'] || justPressed['Enter']) {
      gameState = STATES.PLAYING;
      resetGame();
    }
  }

  // Clear justPressed each frame
  for (const k in justPressed) delete justPressed[k];

  requestAnimationFrame(gameLoop);
}

gameLoop();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
